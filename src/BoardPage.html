<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600&family=Heebo:wght@400;700&family=Assistant:wght@400;700&family=Open+Sans:wght@400;700&family=Noto+Sans+Hebrew:wght@400;700&family=IBM+Plex+Sans+Hebrew:wght@400;600&family=Varela+Round&family=David+Libre:wght@400;700&family=Frank+Ruhl+Libre:wght@400;700&family=Playpen+Sans+Hebrew:wght@400;600&display=swap">
<style>
/* A wall of rounded notes: full-width quote note on top, list notes in a wrapping grid, reminders note at the side.
   The right padding of each note holds the "waiting for" clock. Approved mockup: claude.ai/artifact/PyGCZRjoobgNcmi1qftXpc */
:root{
  --bg:#f6e6d6; --note-auto:#fcf4ec; --paper:#ffffff;
  --ink:#2a2420; --muted:#7c6e64; --accent:#c0602a; --accent-soft:#f6ddc9;
  --done:#ab9f95; --warn:#b4541c; --warn-soft:#fbe7d8; --line:#e2d2c3; --edge:rgba(110,70,35,.2);
  --wait:#7a4fb0; --shadow:rgba(90,50,20,.16); --shadow-soft:rgba(90,50,20,.07);
  --c-white:#ffffff; --c-yellow:#fbf0c4; --c-green:#dcf1dc; --c-blue:#dbe8fb; --c-pink:#f9dfe6; --c-orange:#fbe4cf; --c-gray:#eceef1;
  --ui:"Rubik","Assistant",system-ui,sans-serif;
  --item:"Rubik",system-ui,sans-serif; --item-w:400; --item-s:1rem;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#221a14; --note-auto:#2e241c; --paper:#2b2520;
  --ink:#efe6de; --muted:#ab9d92; --accent:#f0a070; --accent-soft:#4a3020;
  --done:#6f645b; --warn:#f0a070; --warn-soft:#3a2a20; --line:#3d332b; --edge:rgba(255,235,215,.12);
  --wait:#c3a4f0; --shadow:rgba(0,0,0,.45); --shadow-soft:rgba(0,0,0,.25);
  --c-white:#34302c; --c-yellow:#3d3820; --c-green:#1f3a26; --c-blue:#1f2f4a; --c-pink:#43242e; --c-orange:#43301f; --c-gray:#2c3038; color-scheme:dark}}
body[data-bg="gray"]{--bg:#e9ecef;--note-auto:#f6f7f9}
body[data-bg="blue"]{--bg:#e2ebf5;--note-auto:#f2f6fb}
body[data-bg="green"]{--bg:#e3efe2;--note-auto:#f3f8f2}
body[data-bg="pink"]{--bg:#f5e3e7;--note-auto:#fbf2f4}
body[data-bg="sand"]{--bg:#efe8dc;--note-auto:#f8f4ed}
@media (prefers-color-scheme:dark){
 body[data-bg="gray"]{--bg:#181b20;--note-auto:#23272e}
 body[data-bg="blue"]{--bg:#141b26;--note-auto:#1d2735}
 body[data-bg="green"]{--bg:#151d16;--note-auto:#1f2a20}
 body[data-bg="pink"]{--bg:#221519;--note-auto:#2e1e23}
 body[data-bg="sand"]{--bg:#1f1b15;--note-auto:#2a251d}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(14px,env(safe-area-inset-top,0px)) 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;margin-bottom:-6px}
h1{font-family:var(--item);font-weight:var(--item-w);font-size:calc(var(--item-s) * 1.15);color:var(--muted);margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear{margin-inline-start:auto;border:0;background:none;color:var(--muted);font-size:1.1rem;padding:2px 6px;flex:none;border-radius:8px;line-height:1}
.gear:hover{color:var(--ink)}
.sync{font-size:.75rem;color:var(--muted);flex:none}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:4px 10px}
button:focus-visible,input:focus-visible,select:focus-visible,.txt:focus-visible,.name:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{background:var(--note,var(--note-def,var(--note-auto)));border:1px solid var(--edge);border-radius:16px;box-shadow:0 1px 2px var(--shadow),0 4px 14px var(--shadow-soft);position:relative;min-width:0}
.sheet{padding:4px 36px 28px 12px}
.sheet.drop{outline:2px dashed var(--accent)}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;align-items:start}
.sheet h2{font-family:var(--item);font-weight:var(--item-w);font-size:calc(var(--item-s) * 1.4);margin:0;min-height:50px;display:flex;align-items:center}
.sheet h2 .name{border-radius:4px;cursor:text;padding-inline:2px;overflow-wrap:anywhere}
.sheet h2 .name[contenteditable="true"]{background:var(--accent-soft)}
ul{list-style:none;margin:0;padding:0}
li.item{font-family:var(--item);font-weight:var(--item-w);font-size:var(--item-s);line-height:1.3;border-radius:4px;position:relative;background:var(--c,transparent);
  --box:19px;--top:calc(5px + .65 * var(--item-s) - var(--box) / 2);-webkit-touch-callout:none}
@media (pointer:fine){li.item{--box:13px}}
li.item .row{min-height:32px;display:flex;align-items:flex-start;gap:3px;padding-inline:4px}
li.item[draggable="true"] .row{cursor:grab}
li.item .txt{flex:1;min-width:0;overflow-wrap:anywhere;padding:5px 0;border-radius:3px;cursor:text}
li.item .txt[contenteditable="true"]{background:var(--accent-soft);padding-inline:4px}
li.item.done .txt{text-decoration:line-through;color:var(--done)}
li.item.waiting .txt{color:var(--wait)}
.box{appearance:none;-webkit-appearance:none;width:var(--box);height:var(--box);border:1.5px solid var(--muted);border-radius:3px;flex:none;margin:var(--top) 0 0;margin-inline-end:4px;cursor:pointer;display:grid;place-content:center;background:transparent}
.box:checked{border-color:var(--accent)}
.box:checked::after{content:"✓";color:var(--accent);font-size:calc(var(--box) - 3px);font-weight:700;line-height:1}
.ib{border:0;background:none;padding:1px 2px;color:var(--muted);font-size:.78rem;line-height:1;flex:none;border-radius:4px;font-family:var(--ui)}
li.item .row .ib{margin-top:calc(5px + .65 * var(--item-s) - 7.5px)}
@media (pointer:coarse){li.item .row .ib{padding:4px 6px;margin-top:calc(5px + .65 * var(--item-s) - 10.5px)}}
.ib.soft{opacity:.35}
li.item:hover .ib.soft,li.item:focus-within .ib.soft{opacity:.9}
.ib.star.on{opacity:1;color:#d49a00}
@media (hover:hover){.ib.soft:not(.on){opacity:0}}
.cz{width:16px;height:16px;padding:0;border:0;background:none;flex:none;margin-top:calc(5px + .65 * var(--item-s) - 8px);border-radius:50%;cursor:pointer;position:relative}
.cz::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px dotted var(--muted);opacity:0}
@media (hover:none){.cz{width:24px;height:24px;margin-top:calc(5px + .65 * var(--item-s) - 12px)} .cz::after{inset:7px;opacity:.4}}
li.item:hover .cz::after,.cz:focus-visible::after{opacity:.6}
.hg{position:absolute;right:-29px;top:calc(var(--top) + var(--box) / 2 - 8px);width:20px;height:16px;padding:0;border:0;background:none;color:var(--muted);opacity:.3;touch-action:manipulation;display:grid;place-items:center}
@media (pointer:coarse){.hg{width:28px;height:28px;right:-33px;top:calc(var(--top) + var(--box) / 2 - 14px)}}
.hg svg{width:14px;height:14px;display:block}
@media (hover:hover){.hg{opacity:0} li.item:hover .hg,.hg:focus-visible{opacity:.6}}
.hg.on,li.item:hover .hg.on{color:var(--wait);opacity:1}
.add{display:flex;min-height:32px;align-items:center}
.add input{width:100%;border:0;background:transparent;font-family:var(--item);font-weight:var(--item-w);font-size:var(--item-s);color:var(--ink);padding:4px 0}
.add input::placeholder{color:var(--muted);opacity:.7;font-weight:400}
details.donebox summary{min-height:32px;display:flex;align-items:center;color:var(--muted);font-size:.85rem;cursor:pointer;list-style:none}
details.donebox summary::-webkit-details-marker{display:none}
details.donebox summary::before{content:"▸";margin-inline-end:6px}
details.donebox[open] summary::before{content:"▾"}
.clear{border:0;background:none;color:var(--muted);font-size:.8rem;margin-inline-start:auto;padding:2px 6px;text-decoration:underline}
.newlist{border:1.5px dashed var(--line);border-radius:16px;min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:transparent;font-size:1rem}
.pal{position:absolute;left:10px;bottom:6px;border:0;background:none;padding:2px 4px;font-size:15px;line-height:1;opacity:0;filter:grayscale(.4);border-radius:6px}
.pop.nm{width:auto;padding:10px 12px;gap:8px;align-items:center}
.pop.nm .swatches{flex-wrap:nowrap;gap:6px}.pop.nm .swatches button{width:20px;height:20px;font-size:0}
.pop.nm hr{width:100%;border:0;border-top:1px solid var(--line);margin:0}
.pop.nm .btns{justify-content:center;gap:12px}
.pop.nm .bin{border:0;background:none;font-size:15px;padding:4px 10px;opacity:.7}
.pop .arrow{font-size:1.15rem;min-width:52px;padding:4px 0}.pop .arrow:disabled{opacity:.3;cursor:default}
.sep{list-style:none;display:flex;align-items:center;gap:4px;margin:10px 0 2px;color:var(--muted);font-family:var(--ui);font-size:.8rem}
.sep .ar{border:0;background:none;color:var(--muted);font-size:.7rem;padding:2px 4px;width:20px}
.sep .name{cursor:text;padding:0 2px;border-radius:3px}.sep .cnt{font-size:.75rem;opacity:.7}
.sep .ln{flex:1;border-top:1px solid var(--line);min-width:16px}
.sep.drop .ln{border-top:2px dashed var(--accent)}
.sep .x{font-size:.7rem}
@media (hover:hover){.sep .x{opacity:0}.sep:hover .x{opacity:.8}}
@media (hover:none){.sep .x{display:none}.sep .ar{width:28px;padding:6px}}
.pop.nm .addsep{border:0;background:none;color:var(--muted);font-size:.85rem;padding:2px 6px}
.shopnote li.item .star,.shopnote li.item .cz,.shopnote li.item .hg{display:none} /* shopping: tick and text only */
.pal.dots{filter:none;color:var(--muted);font-size:18px;font-weight:700;padding:0 6px}
.pal.dots[draggable="true"]{cursor:grab}
@media (pointer:coarse){.pal.dots{left:2px;bottom:0;padding:8px 14px;font-size:20px}}
.cal .rep{display:inline-block;color:var(--muted);margin-inline-start:6px;vertical-align:-1px;line-height:0}.cal .rep svg{width:.8em;height:.8em}
.note.ghost{opacity:.45}
@media (hover:hover){.note:hover .pal,.pal:focus-visible{opacity:.85}}
@media (hover:none){.pal{opacity:.45}}
.cal li{min-height:32px;display:flex;gap:6px;align-items:center;-webkit-touch-callout:none}
.cal .when{font-variant-numeric:tabular-nums;color:var(--accent);font-size:.82rem;width:48px;flex:none;border:0;background:none;padding:2px 0;text-decoration:underline dotted;text-underline-offset:3px;text-align:start}
.cal .today .when{color:var(--warn);font-weight:700}
.cal .what{flex:1;min-width:0;overflow-wrap:anywhere;font-family:var(--item);font-weight:var(--item-w);font-size:var(--item-s)}
.cal li.gone .what{text-decoration:line-through;color:var(--done)}
.cal li.gone .when{color:var(--done);text-decoration:none;pointer-events:none}
.cal .day{min-height:32px;display:flex;align-items:flex-end;padding-bottom:4px;font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.cal .st{font-size:.75rem;color:var(--muted);flex:none}
.cal .empty{color:var(--muted);font-size:.85rem}
.cal li[draggable="true"]{cursor:grab}
.pill{font-size:.72rem;border-radius:99px;padding:1px 7px;background:var(--warn-soft);color:var(--warn);font-weight:600;flex:none}
.quote{padding:14px 20px 16px;display:flex;flex-direction:column;gap:8px;font-family:var(--item)}
.qh{display:flex;align-items:center;gap:12px}
.qh .sutra{margin:0;flex:1;min-width:0;color:var(--accent);font-weight:700;font-family:var(--item);font-size:calc(var(--item-s) * 1.25);line-height:1.5;text-wrap:balance}
.qh .ib{margin-inline-start:auto;font-size:1.2rem;padding:2px 10px;border:1px solid var(--line);border-radius:8px;line-height:1.2}
.qbody{display:flex;flex-direction:column;gap:6px;max-width:72ch}
.qbody p{margin:0;font-size:var(--item-s);font-weight:var(--item-w);line-height:1.7}
.qbody cite{font-style:normal;font-family:var(--ui);color:var(--muted);font-size:.85rem}
.pop{position:fixed;z-index:20;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px var(--shadow);padding:14px;width:270px;max-width:calc(100vw - 32px);display:flex;flex-direction:column;gap:10px;font-family:var(--ui);font-size:.9rem}
.pop h3{margin:0;font-size:1rem;font-weight:600}
.pop label,.pop .fld{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.pop input,.pop select{font:inherit;font-size:.92rem;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg);color:var(--ink);width:100%}
.pop .since{font-size:.8rem;color:var(--wait);font-weight:600}
.pop .btns{display:flex;gap:6px;flex-wrap:wrap}
.pop .primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.pop .danger{background:none;color:#b3261e;border-color:#b3261e}
.pop .quick{display:flex;gap:4px;flex-wrap:wrap}
.pop .quick button{font-size:.78rem;padding:2px 8px;border-radius:99px}
.pop .menu{display:flex;flex-direction:column;gap:4px}
.pop .menu button{text-align:start}
.seg{display:flex;gap:4px}
.seg button{flex:1;padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:26px;height:26px;border-radius:50%;padding:0;border:1.5px solid var(--line);background:var(--sw)}
.swatches button[aria-pressed="true"]{border-color:var(--ink);border-width:2px}
.swatches .auto{font-size:.65rem;color:var(--muted)}
.toast{position:fixed;bottom:max(16px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.88rem;z-index:30;max-width:calc(100vw - 32px)}
.loading{color:var(--muted);padding:24px 4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="today"></h1>
    <span class="sync" id="sync" aria-live="polite"></span>
    <button type="button" class="gear" id="gear" aria-label="הגדרות" title="הגדרות">⚙</button>
  </header>
  <section class="note quote" id="quote" aria-label="השראה לבוקר" hidden>
    <div class="qh">
      <h2 class="sutra" id="qt"></h2>
      <button type="button" class="ib" id="qmin" aria-expanded="false" aria-label="פתח פרשנות">+</button>
    </div>
    <div class="qbody" id="qbody" hidden><p id="qc"></p><cite id="qs"></cite></div>
  </section>
  <section class="lists" id="lists" aria-label="רשימות"><p class="loading">טוען…</p></section>
  <!-- the reminders note is placed among the notes by renderLists (its place: V.calPos) -->
  <section class="note sheet cal" id="calSheet" aria-labelledby="calh" hidden>
    <h2 id="calh"><span class="name" id="calName">תזכורות קרובות</span></h2>
    <ul id="cal"></ul>
  </section>
</div>
<div class="pop" id="pop" hidden role="dialog" aria-modal="false"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const COLORS=['','yellow','green','blue','pink','orange'];
const NOTE_COLORS=['','white','yellow','green','blue','pink','orange','gray'];
const BGS=[['orange','#f6e6d6','כתום עדין'],['sand','#efe8dc','חול'],['gray','#e9ecef','אפור'],['blue','#e2ebf5','כחול'],['green','#e3efe2','ירוק'],['pink','#f5e3e7','ורוד']];
const FONTS={rubik:['Rubik','Rubik',[400,600]],'rubik-l':['Rubik דק','Rubik',[300,600]],arial:['Arial','Arial',[400,700]],heebo:['Heebo','Heebo',[400,700]],assistant:['Assistant','Assistant',[400,700]],opensans:['Open Sans','"Open Sans"',[400,700]],noto:['Noto Sans','"Noto Sans Hebrew"',[400,700]],plex:['IBM Plex Sans','"IBM Plex Sans Hebrew"',[400,600]],varela:['Varela Round (עגול)','"Varela Round"',[400,400]],david:['David','"David","David Libre"',[400,700]],frank:['Frank Ruhl (עיתון)','"Frank Ruhl Libre"',[400,700]],playpen:['כתב יד עגול','"Playpen Sans Hebrew"',[400,600]]};
const TOUCH=matchMedia('(pointer:coarse)').matches, DEV=TOUCH?'phone':'pc';
const CLOCK='<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="6.6"/><path d="M8 4.2V8l2.6 1.6"/></svg>';
const CACHE='pablo-board-cache-v1';
const KEY='<?= boardKey ?>';
const CALSHEET=document.getElementById('calSheet'); // kept as a node: renderLists detaches and re-inserts it
let S=null, V={font_pc:'rubik',font_phone:'rubik',size_pc:1,size_phone:1,bold:false,bg:'orange',note:'',qopen:false,calNote:'',calName:'',calPos:1};
let editing=null, drag=null;

const el=(tag,props={},kids=[])=>{const e=document.createElement(tag);Object.assign(e,props);kids.forEach(k=>e.append(k));return e};
const btn=(txt,label,fn,cls='')=>{const b=el('button',{type:'button',className:cls,textContent:txt,title:label});b.setAttribute('aria-label',label);if(fn)b.addEventListener('click',fn);return b};
const rid=()=>Math.random().toString(36).slice(2,14);
const pad=n=>String(n).padStart(2,'0');
const isoDay=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dayISO=n=>{const x=new Date();x.setDate(x.getDate()+n);return isoDay(x)};
const daysSince=iso=>Math.max(0,Math.round((new Date(dayISO(0))-new Date(iso))/864e5));
const sinceTxt=iso=>{const n=daysSince(iso);return n===0?'מהיום':n===1?'מאתמול':`כבר ${n} ימים`};
const toast=(t,ms=3500)=>{const x=document.getElementById('toast');x.textContent=t;x.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>x.hidden=true,ms)};
const cache=()=>{try{localStorage.setItem(CACHE,JSON.stringify({S,V}))}catch(e){}};

/* ---------- server: operations go out one by one, in order ---------- */
const queue=[]; let busy=false, fails=0;
function send(op){queue.push(op);cache();pump()}
function pump(){
  if(busy||!queue.length){document.getElementById('sync').textContent=queue.length?'שומר…':'';return}
  busy=true;document.getElementById('sync').textContent='שומר…';
  google.script.run.withSuccessHandler(()=>{queue.shift();busy=false;fails=0;pump()})
    .withFailureHandler(err=>{busy=false;fails++;
      if(fails>=4){toast('לא הצלחתי לשמור: '+(err&&err.message||err)+'. רענן את הדף.',8000);queue.length=0;fails=0;pump();return}
      setTimeout(pump,1500*fails)}).boardOp(queue[0],KEY);
}
function load(quiet){
  google.script.run.withSuccessHandler(d=>{
    if(queue.length||editing||!document.getElementById('pop').hidden){return} // don't pull the page from under the user
    S=d; Object.assign(V,d.view||{}); applyView(); renderAll(); cache();
  }).withFailureHandler(err=>{if(!quiet)toast('טעינה נכשלה: '+(err&&err.message||err),6000)}).boardGet(KEY);
}
let viewT=null;
function saveView(){applyView();clearTimeout(viewT);viewT=setTimeout(()=>send({t:'view.set',view:V}),800)}

function applyView(){
  const [,fam,[w,wb]]=FONTS[V['font_'+DEV]]||FONTS.rubik, r=document.documentElement.style;
  r.setProperty('--item',fam+',"Rubik",system-ui,sans-serif');r.setProperty('--item-w',V.bold?wb:w);r.setProperty('--item-s',`calc(1rem * ${V['size_'+DEV]||1})`);
  document.body.dataset.bg=V.bg||'orange';
  if(V.note)document.body.style.setProperty('--note-def',`var(--c-${V.note})`);else document.body.style.removeProperty('--note-def');
}

/* ---------- floating window ---------- */
const pop=document.getElementById('pop'); let popFor=null;
function openPop(anchor,build){
  pop.innerHTML='';pop.className='pop';build(pop);pop.hidden=false;popFor=anchor;
  const r=anchor.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
  pop.style.left=Math.min(Math.max(16,r.right-w),innerWidth-w-16)+'px';
  let top=r.bottom+6; if(top+h>innerHeight-8)top=Math.max(8,r.top-h-6); pop.style.top=top+'px';
  const f=pop.querySelector('input[type=text]');if(f&&!TOUCH)f.focus();
}
const closePop=()=>{pop.hidden=true;popFor=null};
document.addEventListener('pointerdown',e=>{if(!pop.hidden&&!pop.contains(e.target)&&!(popFor&&popFor.contains(e.target)))closePop()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});
function swatches(list,get,set,auto){
  const w=el('div',{className:'swatches'});
  list.forEach(c=>{const s=btn(c?'':'אוטו',c||'אוטומטי',()=>set(c),c?'':'auto');s.style.setProperty('--sw',c?`var(--c-${c})`:auto);s.setAttribute('aria-pressed',String(get()===c));w.append(s)});
  return w;
}
// touch: a long press opens a menu (drag and double click do not work there)
function longPress(node,fn){
  if(!TOUCH)return; let t=null,x=0,y=0;
  node.addEventListener('touchstart',e=>{const p=e.touches[0];x=p.clientX;y=p.clientY;t=setTimeout(()=>{t=null;fn(e)},520)},{passive:true});
  const stop=()=>{clearTimeout(t)};
  node.addEventListener('touchmove',e=>{const p=e.touches[0];if(Math.abs(p.clientX-x)+Math.abs(p.clientY-y)>10)stop()},{passive:true});
  node.addEventListener('touchend',stop);node.addEventListener('contextmenu',e=>e.preventDefault());
}
function moveMenu(anchor,title,exclude,go){
  openPop(anchor,p=>{p.append(el('h3',{textContent:title}));const m=el('div',{className:'menu'});
    S.lists.filter(l=>l!==exclude).forEach(l=>m.append(btn(l.name,'העבר ל'+l.name,()=>{closePop();go(l)})));p.append(m)});
}

function renderQuote(){
  const q=S&&S.quote; document.getElementById('quote').hidden=!q; if(!q)return;
  document.getElementById('qt').textContent=q.s;document.getElementById('qc').textContent=q.c;document.getElementById('qs').textContent=q.src;
  const b=document.getElementById('qmin');document.getElementById('qbody').hidden=!V.qopen;b.textContent=V.qopen?'−':'+';
  b.setAttribute('aria-expanded',String(!!V.qopen));b.setAttribute('aria-label',V.qopen?'סגור פרשנות':'פתח פרשנות');
}

/* ---------- editable text ---------- */
function caretAt(node,e){
  const sel=document.getSelection();let r=null;
  if(e&&e.clientX!=null){if(document.caretRangeFromPoint)r=document.caretRangeFromPoint(e.clientX,e.clientY);else if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(e.clientX,e.clientY);if(p){r=document.createRange();r.setStart(p.offsetNode,p.offset)}}}
  if(!r||!node.contains(r.startContainer)){r=document.createRange();r.selectNodeContents(node);r.collapse(false)}
  sel.removeAllRanges();sel.addRange(r);
}
function editableName(span,get,set){
  span.tabIndex=0;span.textContent=get();
  const start=e=>{if(span.contentEditable==='true')return;editing='name';span.contentEditable='true';span.focus();caretAt(span,e)};
  span.addEventListener('click',start);
  span.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();span.contentEditable==='true'?span.blur():start()}if(e.key==='Escape'){span.textContent=get();span.blur()}});
  span.addEventListener('blur',()=>{if(span.contentEditable!=='true')return;span.contentEditable='false';editing=null;const v=span.textContent.trim();if(v&&v!==get())set(v);span.textContent=get()});
}

/* ---------- lists ---------- */
function renderLists(){
  const root=document.getElementById('lists'); root.innerHTML='';
  seq().forEach(list=>{
    if(list===CAL){const cs=CALSHEET;cs.hidden=false;root.append(cs);return}
    const seps=list.items.filter(i=>i.k==='sep'),tasks=list.items.filter(i=>i.k!=='sep');
    const open=tasks.filter(i=>!i.done).sort((a,b)=>b.star-a.star), done=tasks.filter(i=>i.done);
    const inSep=i=>seps.some(x=>x.id===i.sec)?i.sec:'';
    const sec=el('section',{className:'note sheet'+(list.kind==='shop'?' shopnote':'')});
    if(list.note)sec.style.setProperty('--note',`var(--c-${list.note})`);
    sec.setAttribute('aria-label',list.name);
    const shop=list.kind==='shop';
    const nm=el('span',{className:'name'});
    if(shop)nm.textContent=list.name; // "לקנות" is fixed: no rename, no delete
    else editableName(nm,()=>list.name,v=>{list.name=v;send({t:'list.set',id:list.id,name:v})});
    const ul=el('ul');open.filter(i=>!inSep(i)).forEach(i=>ul.append(itemEl(list,i)));
    seps.forEach(sp=>{ul.append(sepEl(list,sp));if(!(V.coll||{})[sp.id])open.filter(i=>inSep(i)===sp.id).forEach(i=>ul.append(itemEl(list,i)))});
    const inp=el('input',{id:'add-'+list.id,placeholder:shop?'+ פריט חדש':'+ משימה חדשה',type:'text',enterKeyHint:'enter'});
    inp.setAttribute('aria-label','הוסף ל'+list.name);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&inp.value.trim()){let t=inp.value.trim(),sc='';const m=t.match(/^([^:]{1,30}):\s*(.+)$/),hit=m&&seps.find(x=>x.t.trim()===m[1].trim());if(hit){sc=hit.id;t=m[2].trim()} // "טמבור: מסמרים" goes under that line
      const it={id:rid(),t,star:false,done:false,wait:null,c:'',lastC:'',k:'',sec:sc};list.items.push(it);send({t:'item.add',id:it.id,list:list.id,text:it.t,sec:sc});renderLists();document.getElementById('add-'+list.id).focus()}});
    const h2=el('h2',{},[nm]);
    h2.addEventListener('dragover',e=>{if(drag&&drag.item){e.preventDefault();e.stopPropagation()}});
    h2.addEventListener('drop',e=>{if(!drag||!drag.item)return;e.preventDefault();e.stopPropagation();sec.classList.remove('drop');toSep(drag.list,drag.item,list,'');drag=null}); // dropped on the title: top of the note
    sec.append(h2,ul,el('div',{className:'add'},[inp]));
    if(done.length){
      const sm=el('summary',{},[el('span',{textContent:`בוצעו (${done.length})`}),btn('נקה הכל','מחק את כל מה שסומן',e=>{e.preventDefault();list.items=list.items.filter(x=>!x.done);send({t:'list.clear',id:list.id});renderLists()},'clear')]);
      const d=el('details',{className:'donebox'},[sm]);const du=el('ul');done.forEach(i=>du.append(itemEl(list,i)));d.append(du);sec.append(d)}
    sec.append(noteMenu(sec,list,()=>list.note||'',c=>{list.note=c;send({t:'list.set',id:list.id,note:c});renderLists()},
      shop?null:()=>{S.lists=S.lists.filter(l=>l!==list);send({t:'list.del',id:list.id});renderLists()}));
    sec.addEventListener('dragover',e=>{if(drag){e.preventDefault();sec.classList.add('drop')}});
    sec.addEventListener('dragleave',()=>sec.classList.remove('drop'));
    sec.addEventListener('drop',e=>{e.preventDefault();sec.classList.remove('drop');if(!drag)return;
      if(drag.note){if(drag.note!==list)moveNote(drag.note,seq().indexOf(list))}else if(drag.rem)remToList(drag.rem,list);else if(drag.list!==list)moveItem(drag.list,drag.item,list);drag=null});
    root.append(sec);
  });
  root.append(btn('+ רשימה או פרויקט חדש','רשימה חדשה',()=>{const l={id:rid(),name:'פרויקט חדש',note:'',kind:'list',items:[]};S.lists.push(l);send({t:'list.add',id:l.id,name:l.name});renderLists()},'newlist'));
}
// recurring-reminder mark: two arrows in a circle, muted, no background (Pablo picked option 4)
function repIcon(){const sp=el('span',{className:'rep',title:'תזכורת חוזרת'});sp.innerHTML='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5a5.5 5.5 0 0 1 9.6-2.4M13.5 9.5a5.5 5.5 0 0 1-9.6 2.4"/><path d="M12.5 1.5v3h-3M3.5 14.5v-3h3"/></svg>';return sp}
// order of notes = the lists, with the reminders note (CAL) at V.calPos
const CAL={cal:true};
function seq(){const a=[...S.lists];a.splice(Math.max(0,Math.min(V.calPos==null?1:V.calPos,a.length)),0,CAL);return a}
function moveNote(l,to){
  const a=seq(),from=a.indexOf(l);to=Math.max(0,Math.min(a.length-1,to));if(from<0||from===to)return;
  a.splice(from,1);a.splice(to,0,l);
  const lists=a.filter(x=>x!==CAL),pos=a.indexOf(CAL);
  if(lists.some((x,k)=>x!==S.lists[k])){S.lists=lists;send({t:'list.order',ids:lists.map(x=>x.id)})}
  if(pos!==V.calPos){V.calPos=pos;saveView()}
  renderLists()}
// one ⋯ button per note (Pablo 27.11): a menu with colour, place (earlier / later) and delete.
// On a PC the same button can also be dragged onto another note to move it there.
function noteMenu(sec,list,getC,setC,del){
  const name=()=>list===CAL?(V.calName||'תזכורות קרובות'):list.name;
  const b=btn('⋯','אפשרויות הפתק',()=>openPop(b,build),'pal dots');
  // compact (Pablo 27.11): one row of small colours | ↑ ↓ | small bin. No headings.
  const build=p=>{const k=seq().indexOf(list),n=seq().length;p.classList.add('nm');
    p.append(swatches(NOTE_COLORS,getC,c=>{setC(c);closePop()},'var(--note-def,var(--note-auto))'),el('hr'));
    const up=btn('↑','הזז למעלה',()=>{closePop();moveNote(list,k-1)},'arrow'),dn=btn('↓','הזז למטה',()=>{closePop();moveNote(list,k+1)},'arrow');
    up.disabled=k<=0;dn.disabled=k>=n-1;p.append(el('div',{className:'btns'},[up,dn]));
    if(list!==CAL)p.append(el('hr'),btn('+ קו הפרדה','הוסף קו הפרדה',()=>{closePop();
      const sp={id:rid(),t:list.kind==='shop'?'חנות':'קטע',k:'sep',sec:'',done:false,star:false,wait:null,c:'',lastC:''};list.items.push(sp);
      send({t:'item.add',id:sp.id,list:list.id,text:sp.t,k:'sep'});renderLists();
      const n=document.querySelector(`[data-sep="${sp.id}"] .name`);if(n){n.click();document.getSelection().selectAllChildren(n)}},'addsep'));
    if(del)p.append(el('hr'),btn('🗑','מחק פתק',()=>openPop(b,q=>{
      const cnt=list.items.filter(x=>x.k!=='sep').length;
      q.append(el('h3',{textContent:`למחוק את "${name()}"?`}),el('span',{textContent:cnt?`יימחקו גם ${cnt} המשימות שבו.`:'הפתק ריק.'}),
        el('div',{className:'btns'},[btn('ביטול','ביטול',closePop,'primary keep'),btn('מחק','מחק',()=>{closePop();del()},'danger')]));
      setTimeout(()=>{const x=q.querySelector('.keep');if(x)x.focus()},0)}),'bin'));
  };

  if(!TOUCH){b.draggable=true;b.title='אפשרויות. אפשר גם לגרור כדי להזיז את הפתק';
    b.addEventListener('dragstart',e=>{drag={note:list};e.dataTransfer.setData('text/plain','');e.dataTransfer.setDragImage(sec,20,20);setTimeout(()=>sec.classList.add('ghost'),0)});
    b.addEventListener('dragend',()=>{sec.classList.remove('ghost');drag=null})}
  return b}
function moveItem(from,i,to){from.items=from.items.filter(x=>x!==i);to.items.push(i);i.sec='';send({t:'item.set',id:i.id,f:{list:to.id,sec:''}});renderLists()}
// put an item under a divider of a note (sc = divider id, '' = top of the note); from another note it moves too
function toSep(from,i,list,sc){
  if(from!==list){from.items=from.items.filter(x=>x!==i);list.items.push(i);i.sec=sc;send({t:'item.set',id:i.id,f:{list:list.id,sec:sc}})}
  else if((i.sec||'')!==sc){i.sec=sc;send({t:'item.set',id:i.id,f:{sec:sc}})}
  renderLists()}
// a divider line: ▾ opens / closes its part, the label is edited like a title, ✕ removes the line (its items move up)
function sepEl(list,sp){
  const shut=!!(V.coll||{})[sp.id],n=list.items.filter(x=>x.k!=='sep'&&!x.done&&x.sec===sp.id).length;
  const li=el('li',{className:'sep'+(shut?' shut':'')});li.dataset.sep=sp.id;
  const ar=btn(shut?'◂':'▾',shut?'פתח':'סגור',()=>{V.coll=Object.assign({},V.coll);if(shut)delete V.coll[sp.id];else V.coll[sp.id]=1;saveView();renderLists()},'ar');
  const nm=el('span',{className:'name'});editableName(nm,()=>sp.t,v=>{sp.t=v;send({t:'item.set',id:sp.id,f:{text:v}})});
  const x=btn('✕','הסר קו',()=>{list.items=list.items.filter(y=>y!==sp);list.items.forEach(y=>{if(y.sec===sp.id)y.sec=''});send({t:'sep.del',id:sp.id});renderLists()},'ib soft x');
  li.append(ar,nm);if(shut&&n)li.append(el('span',{className:'cnt',textContent:String(n)}));li.append(el('span',{className:'ln'}),x);
  longPress(nm,()=>openPop(nm,p=>{p.append(btn('הסר את הקו','הסר קו',()=>{closePop();x.click()},'danger'))}));
  li.addEventListener('dragover',e=>{if(drag&&drag.item){e.preventDefault();e.stopPropagation();li.classList.add('drop')}});
  li.addEventListener('dragleave',()=>li.classList.remove('drop'));
  li.addEventListener('drop',e=>{if(!drag||!drag.item)return;e.preventDefault();e.stopPropagation();li.classList.remove('drop');toSep(drag.list,drag.item,list,sp.id);drag=null});
  return li}
function itemEl(list,i){
  const li=el('li',{className:'item'+(i.done?' done':'')+(i.wait&&!i.done?' waiting':'')});
  if(i.c)li.style.setProperty('--c',`var(--c-${i.c})`);
  li.draggable=!i.done&&!TOUCH;
  li.addEventListener('dragstart',e=>{if(editing===i.id){e.preventDefault();return}drag={list,item:i}});
  const row=el('div',{className:'row'});
  const cb=el('input',{type:'checkbox',className:'box',checked:i.done});
  cb.setAttribute('aria-label','בוצע: '+i.t);
  cb.addEventListener('change',()=>{i.done=cb.checked;send({t:'item.set',id:i.id,f:{done:i.done}});setTimeout(renderLists,250)});
  const tx=el('span',{className:'txt',textContent:i.t,tabIndex:0});
  const startEdit=e=>{if(i.done||editing===i.id)return;editing=i.id;li.draggable=false;tx.contentEditable='true';tx.focus();caretAt(tx,e)};
  tx.addEventListener('click',startEdit);
  tx.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();editing===i.id?tx.blur():startEdit()}if(e.key==='Escape'){tx.textContent=i.t;tx.blur()}});
  tx.addEventListener('blur',()=>{if(editing!==i.id||tx.contentEditable!=='true')return;editing=null;const v=tx.textContent.trim();
    if(!v){list.items=list.items.filter(x=>x!==i);send({t:'item.del',id:i.id})}else if(v!==i.t){i.t=v;send({t:'item.set',id:i.id,f:{text:v}})}renderLists()});
  longPress(tx,()=>{if(editing===i.id)return;const seps=list.items.filter(x=>x.k==='sep');
    if(!seps.length)return moveMenu(tx,'העבר ל...',list,l=>moveItem(list,i,l));
    openPop(tx,p=>{const m=el('div',{className:'menu'});
      [{id:'',t:'למעלה'},...seps].filter(x=>x.id!==(i.sec||'')).forEach(x=>m.append(btn(x.t,'העבר ל'+x.t,()=>{closePop();toSep(list,i,list,x.id)})));
      const o=el('div',{className:'menu'});S.lists.filter(l=>l!==list).forEach(l=>o.append(btn(l.name,'העבר ל'+l.name,()=>{closePop();moveItem(list,i,l)})));
      p.append(el('h3',{textContent:'בפתק הזה:'}),m,el('h3',{textContent:'לפתק אחר:'}),o)})});
  row.append(cb,tx);
  if(!i.done){
    row.append(btn(i.star?'★':'☆',i.star?'בטל הצמדה':'הצמד למעלה',()=>{i.star=!i.star;send({t:'item.set',id:i.id,f:{star:i.star}});renderLists()},'ib star soft'+(i.star?' on':'')));
    row.append(btn('','צבע השורה',()=>{if(i.c){i.lastC=i.c;i.c=''}else{const n=COLORS.slice(1);i.c=n[(n.indexOf(i.lastC||'')+1)%n.length]}send({t:'item.set',id:i.id,f:{c:i.c,lastC:i.lastC}});renderLists()},'cz'));
    const hg=btn('',i.wait?('ממתין'+(i.wait.note?': '+i.wait.note:'')+', '+sinceTxt(i.wait.since)):(TOUCH?'הקשה: ממתין. לחיצה ארוכה: הערה':'קליק: ממתין. דאבל קליק: הערה'),null,'hg'+(i.wait?' on':''));hg.innerHTML=CLOCK;
    let t=null;
    hg.addEventListener('click',()=>{clearTimeout(t);t=setTimeout(()=>{i.wait=i.wait?null:{note:'',since:dayISO(0)};send({t:'item.set',id:i.id,f:{wait:i.wait}});renderLists()},TOUCH?0:260)});
    hg.addEventListener('dblclick',e=>{clearTimeout(t);e.preventDefault();waitPop(hg,i)});
    longPress(hg,()=>{clearTimeout(t);waitPop(hg,i)});
    li.append(hg);
  }
  if(i.done)row.append(btn('✕','מחק',()=>{list.items=list.items.filter(x=>x!==i);send({t:'item.del',id:i.id});renderLists()},'ib soft'));
  li.append(row);
  return li;
}
function waitPop(anchor,i){
  openPop(anchor,p=>{
    p.append(el('h3',{textContent:'ממתין ל...'}));
    const note=el('input',{id:'w-note',type:'text',value:i.wait&&i.wait.note||'',placeholder:'למשל: המוסך, שיחזרו עם מועד'});
    const since=el('input',{id:'w-since',type:'date',value:i.wait&&i.wait.since||dayISO(0)});
    p.append(el('label',{},['הערה',note]),el('label',{},['מאז',since]));
    if(i.wait)p.append(el('span',{className:'since',textContent:sinceTxt(i.wait.since)}));
    const ok=()=>{i.wait={note:note.value.trim(),since:since.value||dayISO(0)};send({t:'item.set',id:i.id,f:{wait:i.wait}});closePop();renderLists()};
    note.addEventListener('keydown',e=>{if(e.key==='Enter')ok()});
    const b=el('div',{className:'btns'},[btn('שמור','שמור',ok,'primary')]);
    if(i.wait)b.append(btn('קיבלתי, הסר','הסר ממתין',()=>{i.wait=null;send({t:'item.set',id:i.id,f:{wait:null}});closePop();renderLists()}));
    p.append(b);
  });
}

/* ---------- reminders ---------- */
function remToList(r,list){
  const it={id:rid(),t:r.t,star:false,done:false,wait:null,c:'',lastC:''};list.items.push(it);r.st='task';r.to=list.name;
  send({t:'rem.tolist',id:r.id,at:r.at,item:it.id,list:list.id,listName:list.name});renderAll();
}
function timePop(anchor,r){
  openPop(anchor,p=>{
    p.append(el('h3',{textContent:r.t}));
    const dt=el('input',{id:'r-date',type:'date',value:r.date}),tm=el('input',{id:'r-time',type:'time',value:r.time,step:300});
    p.append(el('label',{},['יום',dt]),el('label',{},['שעה',tm]));
    const q=el('div',{className:'quick'});
    [['עוד שעה',()=>{const x=new Date(Date.now()+36e5);dt.value=isoDay(x);tm.value=pad(x.getHours())+':'+pad(x.getMinutes())}],
     ['מחר',()=>{const x=new Date(dt.value||r.date);x.setDate(x.getDate()+1);dt.value=x.toISOString().slice(0,10)}],
     ['שבוע הבא',()=>{const x=new Date(dt.value||r.date);x.setDate(x.getDate()+7);dt.value=x.toISOString().slice(0,10)}]].forEach(([n,f])=>q.append(btn(n,n,f)));
    p.append(q,el('div',{className:'btns'},[btn('שמור','שמור',()=>{
      const d=dt.value||r.date,t=tm.value||r.time;
      if(new Date(d+'T'+t)<new Date()){toast('הזמן הזה כבר עבר');return}
      r.date=d;r.time=t;const op={t:'rem.move',id:r.id,at:r.at,date:d,time:t};r.at=new Date(d+'T'+t).getTime();send(op);closePop();renderCal()},'primary')]));
  });
}
function renderCal(){
  const cs=CALSHEET;
  if(V.calNote)cs.style.setProperty('--note',`var(--c-${V.calNote})`);else cs.style.removeProperty('--note');
  CALSHEET.querySelector('#calName').textContent=V.calName||'תזכורות קרובות';
  const ul=CALSHEET.querySelector('#cal');ul.innerHTML='';let last='';
  const dayName=iso=>{const diff=Math.round((new Date(iso)-new Date(dayISO(0)))/864e5);return diff===0?'היום':diff===1?'מחר':new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'numeric'}).format(new Date(iso))};
  const now=new Date(),hhmm=pad(now.getHours())+':'+pad(now.getMinutes());
  const list=[...(S.cal||[])].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  if(!list.length)ul.append(el('li',{className:'empty',textContent:'אין תזכורות בשבוע הקרוב.'}));
  list.forEach(r=>{
    const dn=dayName(r.date); if(dn!==last){ul.append(el('li',{className:'day',textContent:dn}));last=dn}
    const li=el('li',{className:(dn==='היום'?'today':'')+(r.st?' gone':'')});
    li.append(btn(r.time,'שנה מועד',e=>timePop(e.currentTarget,r),'when'),el('span',{className:'what'},[r.t,...(r.series?[repIcon()]:[])]));
    if(r.st)li.append(el('span',{className:'st',textContent:r.st==='task'?'הועבר ל'+(r.to||'פתק'):'בוצע'}),btn('↶','החזר',()=>{r.st='';r.to='';send({t:'rem.undo',id:r.id,at:r.at});renderCal()},'ib'));
    else{
      if(dn==='היום'&&r.time<hhmm)li.append(el('span',{className:'pill',textContent:'עבר'}));
      if(!TOUCH){li.draggable=true;li.title='אפשר לגרור לפתק';li.addEventListener('dragstart',()=>{drag={rem:r}})}
      longPress(li,()=>moveMenu(li,'להעביר לפתק:',null,l=>remToList(r,l)));
      li.append(btn('✓','בוצע',()=>{r.st='done';send({t:'rem.done',id:r.id,at:r.at});renderCal()},'ib'),
        btn('✕',r.series?'בטל את הפעם הזאת':'בטל תזכורת',()=>{S.cal=S.cal.filter(x=>x!==r);send({t:'rem.cancel',id:r.id,at:r.at});toast(r.series?'בוטלה הפעם הזאת':'התזכורת בוטלה');renderCal()},'ib'));
    }
    ul.append(li);
  });
}
editableName(CALSHEET.querySelector('#calName'),()=>V.calName||'תזכורות קרובות',v=>{V.calName=v;saveView()});
{const cs=CALSHEET;
  cs.append(noteMenu(cs,CAL,()=>V.calNote||'',c=>{V.calNote=c;saveView();renderCal()},null));
  cs.addEventListener('dragover',e=>{if(drag&&drag.note&&drag.note!==CAL){e.preventDefault();cs.classList.add('drop')}});
  cs.addEventListener('dragleave',()=>cs.classList.remove('drop'));
  cs.addEventListener('drop',e=>{e.preventDefault();cs.classList.remove('drop');if(drag&&drag.note&&drag.note!==CAL)moveNote(drag.note,seq().indexOf(CAL));drag=null})}

function renderAll(){
  document.getElementById('today').textContent=new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
  if(!S)return; renderQuote(); renderLists(); renderCal();
}
try{const c=JSON.parse(localStorage.getItem(CACHE));if(c&&c.S){S=c.S;Object.assign(V,c.V||{})}}catch(e){}
applyView(); renderAll(); load();
setInterval(()=>load(true),60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(true)});
</script>
